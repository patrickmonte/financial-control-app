apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-backend
  namespace: financial-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: financial-backend }
  template:
    metadata:
      labels: { app: financial-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: financial-control-backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000, name: http }]
          env:
            - name: PORT
              valueFrom: { configMapKeyRef: { name: financial-control-config, key: BACKEND_PORT } }
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: financial-control-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: financial-control-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: financial-control-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: financial-control-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: financial-control-config, key: POSTGRES_DB } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: financial-control-secrets, key: JWT_SECRET } }
            - name: CORS_ORIGIN
              valueFrom: { configMapKeyRef: { name: financial-control-config, key: CORS_ORIGIN } }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 8
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
