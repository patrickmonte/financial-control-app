apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-frontend
  namespace: financial-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: financial-frontend }
  template:
    metadata:
      labels: { app: financial-frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: financial-control-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir: {}
